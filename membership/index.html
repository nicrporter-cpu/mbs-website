<script type="text/babel" data-presets="react">
/* MBS site patches — loaded ahead of every screen, patches the design system in place.
 *
 * The vendored bundle in design-system/_ds_bundle.js is generated output and gets
 * overwritten wholesale by a design-system refresh. Rather than edit it, this file
 * replaces the handful of components that needed fixing on the shared namespace.
 * The screens destructure from that namespace after this block runs, so they pick
 * up the patched versions without knowing anything changed.
 *
 * What is patched and why:
 *   Icon        the set is extended; the screens used emoji for glyphs it lacked
 *   SiteHeader  nav was <a onClick> with no href — unreachable by keyboard; no mobile nav
 *   SiteFooter  social and legal links were all href="#"
 *   PageHeader  fixed 300px height, subtitle at 3.5:1
 *   Modal       no dialog role, no focus trap, unnamed close button
 *   Field       <label> had no htmlFor and did not wrap its control
 *   DataTable   no scroll container, so it squeezed below ~520px
 */

(() => {

const DS = window.MBSDesignSystem_f206f7;
const R = window.MBS_ROUTES;

/* React 18 has useId; the counter is a unique-per-instance fallback so ids never
   collide if this ever runs against an older React. */
let __uid = 0;
const useUid = () => (React.useId ? React.useId() : React.useRef('mbs-' + (++__uid)).current);

/* ── Icon ───────────────────────────────────────────────────────────────────
   The design system ships twelve 1.75px line glyphs with rounded joins. The
   screens needed eleven more and reached for emoji instead. These are drawn to
   the same construction: 24×24 box, single compound path, no fill. */

const EXTRA_ICON_PATHS = {
  /* content glyphs, replacing the emoji in screens/data.js */
  mic: 'M12 2.5a2.75 2.75 0 0 1 2.75 2.75v6a2.75 2.75 0 0 1-5.5 0v-6A2.75 2.75 0 0 1 12 2.5M18 10.5v.75a6 6 0 0 1-12 0v-.75M12 17.25V21.5M8.5 21.5h7',
  bolt: 'M13.5 2.5 5 13.5h5.5L10 21.5l8.5-11H13z',
  trophy: 'M7.5 3.5h9v5.25a4.5 4.5 0 0 1-9 0zM7.5 5.5h-3v.75a3 3 0 0 0 3 3M16.5 5.5h3v.75a3 3 0 0 1-3 3M12 13.25v4.25M8.5 21.5h7l-1-4h-5z',
  target: 'M12 2.5a9.5 9.5 0 1 1 0 19 9.5 9.5 0 0 1 0-19M12 7.25a4.75 4.75 0 1 1 0 9.5 4.75 4.75 0 0 1 0-9.5M12 11.5a.5.5 0 1 1 0 1 .5.5 0 0 1 0-1',
  bulb: 'M9 18.5h6M10 21.5h4M12 2.5a6.75 6.75 0 0 1 3.75 12.37v2.13h-7.5v-2.13A6.75 6.75 0 0 1 12 2.5',
  scale: 'M12 3.5v17M7 6.5h10M6 20.5h12M6 6.5 3 13h6zM18 6.5 15 13h6zM3 13a3 3 0 0 0 6 0M15 13a3 3 0 0 0 6 0',
  rocket: 'M12 2.5c3 2.25 4.75 5.75 4.75 9.5L14 15h-4l-2.75-3c0-3.75 1.75-7.25 4.75-9.5M9.5 15l-2 4.5 3.25-1.5M14.5 15l2 4.5-3.25-1.5M12 8a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3',

  /* interface glyphs */
  menu: 'M4 7h16M4 12h16M4 17h16',
  close: 'M6 6l12 12M18 6 6 18',
  chevronDown: 'M6 9.5l6 6 6-6',
  chevronLeft: 'M15 5.5l-6.5 6.5 6.5 6.5',
  chevronRight: 'M9 5.5l6.5 6.5-6.5 6.5',
  linkedin: 'M4.5 3.5h15a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1M8 10.5v6M8 7.6v.02M12 16.5v-6M12 13a2.5 2.5 0 0 1 5 0v3.5',
  instagram: 'M7.5 3.5h9a4 4 0 0 1 4 4v9a4 4 0 0 1-4 4h-9a4 4 0 0 1-4-4v-9a4 4 0 0 1 4-4M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8M17.2 6.8v.02'
};

function Icon({ name, size = '1.15em', strokeWidth = 1.75, style, ...rest }) {
  const d = EXTRA_ICON_PATHS[name] || (DS.ICON_PATHS && DS.ICON_PATHS[name]);
  if (!d) return null;
  return (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false"
      style={{ display: 'inline-block', verticalAlign: '-.15em', flexShrink: 0, ...style }} {...rest}>
      <path d={d} />
    </svg>
  );
}

/* ── Section ────────────────────────────────────────────────────────────────
   The band + centred column wrapper that every screen had its own identical
   copy of. Hoisted here once, and driven by classes so padding and gutters can
   follow the breakpoints. */

function Section({ children, tone, className = '', style }) {
  const band = tone === 'alt' ? ' mbs-sec--alt' : tone === 'navy' ? ' mbs-sec--navy' : '';
  return (
    <div className={'mbs-sec' + band + (className ? ' ' + className : '')} style={style}
      {...(tone === 'navy' ? { 'data-on-navy': '' } : {})}>
      <div className="mbs-sec-inner">{children}</div>
    </div>
  );
}

/* ── SiteHeader ─────────────────────────────────────────────────────────────
   Every nav item is a real anchor with a real href, so the whole navigation is
   keyboard reachable, middle-clickable and openable in a new tab. Below 900px
   the row collapses into a drawer. */

/* The DE/EN switch. A two-button segmented control — real buttons, so it is
   keyboard operable and announced; the active language is pressed. Setting the
   language re-renders the whole app in place, so the switch is instant. */
function LangSwitch({ lang, setLang, ui }) {
  const langs = [{ code: 'en', label: 'EN' }, { code: 'de', label: 'DE' }];
  return (
    <div className="mbs-lang" role="group" aria-label={(ui && ui.langLabel) || 'Language'}>
      {langs.map(l => (
        <button key={l.code} type="button"
          className={'mbs-lang-btn' + (lang === l.code ? ' is-active' : '')}
          aria-pressed={lang === l.code} onClick={() => setLang(l.code)}>{l.label}</button>
      ))}
    </div>
  );
}

function SiteHeader({ links = [], active, logoSrc, applyLabel = 'Join Munich Business Society', lang = 'en', setLang, ui = {}, style }) {
  const [open, setOpen] = React.useState(false);
  const toggleRef = React.useRef(null);
  const href = id => (R && R[id]) || '#';
  const setL = setLang || function () {};

  React.useEffect(() => {
    if (!open) return;
    const onKey = e => {
      if (e.key === 'Escape') { setOpen(false); toggleRef.current && toggleRef.current.focus(); }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [open]);

  return (
    <nav className="mbs-nav" style={style} aria-label={ui.home ? undefined : 'Main navigation'}>
      <a className="mbs-nav-brand" href={href('home')} aria-label={ui.home || 'Munich Business Society, home'}>
        <img src={logoSrc} alt="" width="204" height="92" />
      </a>

      <div className="mbs-nav-right">
        <div className="mbs-nav-links">
          {links.map(l => (
            <a key={l.id} className={'mbs-navlink' + (active === l.id ? ' is-active' : '')}
              href={href(l.id)} aria-current={active === l.id ? 'page' : undefined}>{l.label}</a>
          ))}
          <a className="mbs-nav-cta" href={href('join')}>{applyLabel}</a>
        </div>

        <LangSwitch lang={lang} setLang={setL} ui={ui} />

        <button ref={toggleRef} type="button" className="mbs-nav-toggle" aria-expanded={open}
          aria-controls="mbs-drawer" onClick={() => setOpen(v => !v)}>
          <Icon name={open ? 'close' : 'menu'} size="22px" />
          <span className="mbs-sr">{open ? (ui.menuClose || 'Close menu') : (ui.menuOpen || 'Open menu')}</span>
        </button>
      </div>

      <div id="mbs-drawer" className={'mbs-drawer' + (open ? ' is-open' : '')} hidden={!open}>
        {links.map(l => (
          <a key={l.id} className={'mbs-drawer-link' + (active === l.id ? ' is-active' : '')}
            href={href(l.id)} aria-current={active === l.id ? 'page' : undefined}>{l.label}</a>
        ))}
        <a className="mbs-nav-cta mbs-drawer-cta" href={href('join')}>{applyLabel}</a>
      </div>
    </nav>
  );
}

/* ── SiteFooter ─────────────────────────────────────────────────────────────
   The deck's four-column footer plus a newsletter block. Social tiles carry
   real icons and real destinations; anything without one yet renders as plain
   text marked "in preparation" rather than a link that goes nowhere. */

function SocialTile({ item }) {
  const [over, setOver] = React.useState(false);
  const tile = {
    width: '40px', height: '40px', borderRadius: 'var(--mbs-r-sm)',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    background: over ? 'var(--mbs-gold-tile)' : 'var(--mbs-on-navy-fill-hi)',
    border: '1px solid ' + (over ? 'var(--mbs-gold-tile-border)' : 'var(--mbs-on-navy-border)'),
    color: over ? 'var(--mbs-gold-on-navy)' : 'var(--mbs-on-navy-50)',
    textDecoration: 'none', transition: 'all var(--mbs-dur) var(--mbs-ease)'
  };
  if (!item.href) {
    return (
      <span style={{ ...tile, opacity: .55, cursor: 'default' }} title={item.label + ', in preparation'}>
        <Icon name={item.icon} size="18px" />
        <span className="mbs-sr">{item.label}, in preparation</span>
      </span>
    );
  }
  return (
    <a href={item.href} title={item.label} style={tile}
      onMouseEnter={() => setOver(true)} onMouseLeave={() => setOver(false)}
      {...(/^https?:/.test(item.href) ? { target: '_blank', rel: 'noopener noreferrer' } : {})}>
      <Icon name={item.icon} size="18px" />
      <span className="mbs-sr">{item.label}</span>
    </a>
  );
}

/* Newsletter — posts to window.MBS_API_ENDPOINT (formType: 'newsletter'),
   see screens/data.js and worker/README.md. Still only a signup *capture*:
   an address lands in the Sheet/notification email, but actually composing
   and sending a monthly newsletter to that list is a separate, not-yet-built
   step (a mailing-list tool decision, out of scope here). */
function Newsletter({ nl = {} }) {
  const [done, setDone] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [submitting, setSubmitting] = React.useState(false);
  const doneRef = React.useRef(null);
  const renderedAtRef = React.useRef(Date.now());
  const id = useUid();
  const hpId = useUid();

  React.useEffect(() => { if (done && doneRef.current) doneRef.current.focus(); }, [done]);

  const onSubmit = e => {
    e.preventDefault();
    const data = new FormData(e.currentTarget);
    const email = String(data.get('news_email') || '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      setError(nl.err || 'Please enter a valid email address.');
      return;
    }
    setError(null);
    setSubmitting(true);
    data.set('mbs_rendered_at', String(renderedAtRef.current));
    window.MBS_SUBMIT_FORM(data, 'newsletter').then(result => {
      setSubmitting(false);
      if (result.ok) setDone(true);
      else setError(nl.sendError || 'Something went wrong. Please try again.');
    });
  };

  return (
    <div className="mbs-footer-news">
      <div>
        <h2 style={{ fontFamily: 'var(--mbs-font-serif)', fontSize: '18px', fontWeight: 600, color: 'var(--mbs-white)', margin: '0 0 6px' }}>{nl.h}</h2>
        <p style={{ fontSize: '13px', color: 'var(--mbs-on-navy-50)', lineHeight: 1.6, margin: 0, maxWidth: '420px' }}>{nl.body}</p>
      </div>
      {done ? (
        <p ref={doneRef} tabIndex={-1} role="status" style={{ outline: 'none', fontSize: '13px', color: 'var(--mbs-gold-on-navy)', margin: 0, alignSelf: 'center' }}>{nl.done}</p>
      ) : (
        <form onSubmit={onSubmit} noValidate className="mbs-news-form">
          <label htmlFor={id} className="mbs-sr">{nl.srEmail}</label>
          <input id={id} name="news_email" type="email" inputMode="email" placeholder={nl.placeholder}
            aria-invalid={error ? 'true' : undefined} aria-describedby={error ? id + '-err' : undefined}
            className="mbs-news-input" />
          {/* Honeypot — see worker/src/lib/spam.js. */}
          <div aria-hidden="true" style={{ position: 'absolute', width: '1px', height: '1px', overflow: 'hidden', clip: 'rect(0,0,0,0)' }}>
            <label htmlFor={hpId}>Leave this field empty</label>
            <input id={hpId} type="text" name="mbs_hp_field" tabIndex={-1} autoComplete="off" />
          </div>
          <button type="submit" className="mbs-nav-cta mbs-news-btn" disabled={submitting}>{submitting ? (nl.sending || nl.btn) : nl.btn}</button>
          {error && <span id={id + '-err'} role="alert" className="mbs-news-err">{error}</span>}
        </form>
      )}
    </div>
  );
}

function FooterCol({ col, inPrep = 'in preparation' }) {
  const href = it => it.href || (it.to && R && R[it.to]) || null;
  return (
    <div>
      <div className="mbs-label mbs-label-light" style={{ marginBottom: '14px' }}>{col.title}</div>
      <ul style={{ listStyle: 'none', margin: 0, padding: 0, display: 'flex', flexDirection: 'column', gap: '10px' }}>
        {col.items.map(it => {
          const h = href(it);
          return (
            <li key={it.label}>
              {h ? (
                <a href={h} style={{ fontSize: '13px', color: 'var(--mbs-on-navy-50)', textDecoration: 'none' }}
                  {...(/^https?:/.test(h) ? { target: '_blank', rel: 'noopener noreferrer' } : {})}>{it.label}</a>
              ) : (
                <span title={it.label + ', ' + inPrep} style={{ fontSize: '13px', color: 'var(--mbs-on-navy-35)', cursor: 'default' }}>
                  {it.label} <span style={{ fontSize: '10px' }}>({inPrep})</span>
                </span>
              )}
            </li>
          );
        })}
      </ul>
    </div>
  );
}

function SiteFooter({
  descriptor = '', columns = [], social = [], newsletter = {}, inPrep = 'in preparation',
  copyright = '© 2026 Munich Business Society', tagline = 'Every campus. One network.', style
}) {
  return (
    <footer data-on-navy="" style={{ background: 'var(--mbs-navy)', borderTop: '1px solid var(--mbs-on-navy-border)', ...style }}>
      <div className="mbs-footer-inner">
        <div className="mbs-footer-top">
          <div>
            <div style={{
              fontFamily: 'var(--mbs-font-serif)', fontSize: '14px', fontWeight: 'var(--mbs-fw-bold)',
              color: 'var(--mbs-white)', letterSpacing: '1px', textTransform: 'uppercase', marginBottom: '8px'
            }}>Munich Business <span style={{ color: 'var(--mbs-gold-on-navy)' }}>Society</span></div>
            <p style={{ fontSize: '12px', color: 'var(--mbs-on-navy-35)', lineHeight: 1.6, maxWidth: '320px', margin: 0 }}>{descriptor}</p>
          </div>
          <div style={{ display: 'flex', gap: '12px' }}>
            {social.map(s => <SocialTile key={s.label} item={s} />)}
          </div>
        </div>

        {columns.length > 0 && (
          <div className="mbs-footer-cols">
            {columns.map(c => <FooterCol key={c.title} col={c} inPrep={inPrep} />)}
          </div>
        )}

        <Newsletter nl={newsletter} />

        <div style={{ height: '1px', background: 'var(--mbs-on-navy-border)', margin: '32px 0 24px' }} />

        <div className="mbs-footer-bottom">
          <span style={{ fontSize: '11px', color: 'var(--mbs-on-navy-25)' }}>{copyright}</span>
          <span style={{ fontSize: '11px', color: 'var(--mbs-gold-on-navy)', letterSpacing: '.3px' }}>{tagline}</span>
        </div>
      </div>
    </footer>
  );
}

/* ── PageHeader ─────────────────────────────────────────────────────────────
   Height becomes a minimum so long German titles can grow into it instead of
   overflowing, and the subtitle clears 4.5:1. */

function PageHeader({ title, subtitle, height = 300, imageSrc, style }) {
  /* Height travels as a custom property so a breakpoint can shrink it; an
     inline min-height could not be overridden from the stylesheet. */
  return (
    <header className="mbs-page-header" style={{ '--mbs-ph-h': height + 'px', ...style }}>
      {imageSrc && <img src={imageSrc} alt="" style={{
        position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', opacity: .35
      }} />}
      <div style={{ position: 'relative', zIndex: 2, padding: '24px' }}>
        <h1 style={{
          fontFamily: 'var(--mbs-font-serif)', fontSize: 'var(--mbs-fs-h1)', fontWeight: 'var(--mbs-fw-bold)',
          color: 'var(--mbs-white)', letterSpacing: 'var(--mbs-tr-title)', margin: '0 0 10px'
        }}>{title}</h1>
        {subtitle && <p style={{
          fontSize: 'var(--mbs-fs-body)', color: 'var(--mbs-on-navy-50)',
          maxWidth: '480px', margin: '0 auto', lineHeight: 'var(--mbs-lh-body)'
        }}>{subtitle}</p>}
      </div>
    </header>
  );
}

/* ── Modal ──────────────────────────────────────────────────────────────────
   Real dialog semantics: labelled by its own title, focus moved in on open,
   tab cycled inside, focus returned to the opener on close. */

function Modal({ open = true, tag, title, meta = [], children, footer, onClose, closeLabel = 'Close dialog', style }) {
  const panelRef = React.useRef(null);
  const openerRef = React.useRef(null);
  const titleId = useUid();

  React.useEffect(() => {
    if (!open) return;
    openerRef.current = document.activeElement;
    const panel = panelRef.current;
    if (panel) {
      const first = panel.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      (first || panel).focus();
    }
    const onKey = e => {
      if (e.key !== 'Tab' || !panel) return;
      const f = [...panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
        .filter(el => el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('keydown', onKey);
      if (openerRef.current && openerRef.current.focus) openerRef.current.focus();
    };
  }, [open]);

  if (!open) return null;
  return (
    <div onClick={e => { if (e.target === e.currentTarget && onClose) onClose(); }}
      style={{
        position: 'absolute', inset: 0, background: 'var(--mbs-scrim-navy)',
        backdropFilter: 'var(--mbs-blur-scrim)', display: 'flex', alignItems: 'center',
        justifyContent: 'center', padding: '24px', zIndex: 200
      }}>
      <div ref={panelRef} role="dialog" aria-modal="true" aria-labelledby={titleId} tabIndex={-1}
        style={{
          background: 'var(--mbs-white)', borderRadius: 'var(--mbs-r-lg)', maxWidth: '640px',
          width: '100%', maxHeight: '90%', overflowY: 'auto', boxShadow: 'var(--mbs-sh-xl)', ...style
        }}>
        <div style={{
          background: 'var(--mbs-navy)', padding: '32px 36px',
          borderRadius: 'var(--mbs-r-lg) var(--mbs-r-lg) 0 0', position: 'relative'
        }} data-on-navy="">
          {onClose && (
            <button type="button" onClick={onClose} aria-label={closeLabel} style={{
              position: 'absolute', top: '16px', right: '16px', width: '36px', height: '36px',
              borderRadius: '50%', background: 'rgba(255,255,255,.12)', border: 'none',
              color: 'var(--mbs-on-navy-70)', cursor: 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'center'
            }}><Icon name="close" size="18px" /></button>
          )}
          {tag && <span style={{
            display: 'inline-block', fontSize: 'var(--mbs-fs-badge)', fontWeight: 'var(--mbs-fw-semibold)',
            letterSpacing: 'var(--mbs-tr-badge)', textTransform: 'uppercase', color: 'var(--mbs-navy)',
            background: 'var(--mbs-gold-surface)', padding: '4px 12px',
            borderRadius: 'var(--mbs-r-pill)', marginBottom: '14px'
          }}>{tag}</span>}
          <h2 id={titleId} style={{
            fontFamily: 'var(--mbs-font-serif)', fontSize: '24px', fontWeight: 'var(--mbs-fw-bold)',
            color: 'var(--mbs-white)', margin: 0
          }}>{title}</h2>
          {meta.length > 0 && <div style={{
            display: 'flex', gap: '20px', flexWrap: 'wrap', fontSize: 'var(--mbs-fs-ui)',
            color: 'var(--mbs-on-navy-50)', marginTop: '12px'
          }}>{meta.map((m, i) => <span key={i}>{m}</span>)}</div>}
        </div>
        <div style={{ padding: '32px 36px' }}>
          {children}
          {footer && <div style={{ marginTop: '28px' }}>{footer}</div>}
        </div>
      </div>
    </div>
  );
}

/* ── Field ──────────────────────────────────────────────────────────────────
   The label is bound to its control, so clicking it focuses the field and a
   screen reader announces a name. Errors are announced when they appear. */

function Field({ label, children, help, error, required, htmlFor, style }) {
  const auto = useUid();
  const id = htmlFor || auto;
  const msgId = id + '-msg';
  const control = React.isValidElement(children)
    ? React.cloneElement(children, {
        id,
        invalid: error ? true : children.props.invalid,
        required: required || children.props.required,
        'aria-describedby': (error || help) ? msgId : undefined,
        'aria-invalid': error ? 'true' : undefined
      })
    : children;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '6px', marginBottom: '20px', ...style }}>
      {label && (
        <label htmlFor={id} style={{
          fontSize: 'var(--mbs-fs-form-label)', fontWeight: 'var(--mbs-fw-semibold)',
          color: 'var(--mbs-navy)', letterSpacing: '.5px', textTransform: 'uppercase'
        }}>
          {label}
          {required && <span aria-hidden="true" style={{ color: 'var(--mbs-danger)', marginLeft: '4px' }}>*</span>}
        </label>
      )}
      {control}
      {(error || help) && (
        <span id={msgId} role={error ? 'alert' : undefined}
          style={{ fontSize: '12px', color: error ? 'var(--mbs-danger)' : 'var(--mbs-gray)' }}>
          {error || help}
        </span>
      )}
    </div>
  );
}

/* ── SectionHeading ─────────────────────────────────────────────────────────
   The gold eyebrow above every section title was brand gold on white (2.65:1)
   and gold at 80% alpha on navy (3.1:1). The divider rule keeps the brand gold:
   it is a graphic, not text. */

function SectionHeading({ label, title, desc, divider = true, tone = 'light', align = 'left', style }) {
  const light = tone === 'light';
  const center = align === 'center';
  /* The gold eyebrow used to sit above a longer descriptive title; the eyebrow
     text now carries the heading itself, at the title's size and in the
     title's navy/white, so a section has one heading line, not two. Where no
     label was given (a screen kept only `title`), title still renders on its
     own the way it always has. */
  const heading = label || title;
  return (
    <div style={{ textAlign: align, ...style }}>
      {heading && <h2 style={{
        fontFamily: 'var(--mbs-font-serif)', fontSize: 'var(--mbs-fs-h2)',
        fontWeight: 'var(--mbs-fw-bold)', lineHeight: 'var(--mbs-lh-title)',
        letterSpacing: 'var(--mbs-tr-title)', margin: 0,
        color: light ? 'var(--mbs-navy)' : 'var(--mbs-white)'
      }}>{heading}</h2>}
      {divider && <div style={{
        width: 'var(--mbs-divider-w)', height: '2px', background: 'var(--mbs-gold)',
        borderRadius: '2px', margin: center ? '18px auto 28px' : '18px 0 28px'
      }} />}
      {desc && <p style={{
        fontSize: 'var(--mbs-fs-body)', lineHeight: 'var(--mbs-lh-prose)', maxWidth: '560px',
        margin: center ? '0 auto' : 0, color: light ? 'var(--mbs-gray)' : 'var(--mbs-on-navy-50)'
      }}>{desc}</p>}
    </div>
  );
}

/* ── Button ─────────────────────────────────────────────────────────────────
   Navy on brand gold is 4.00:1 at 13px; the gold fill moves to the surface
   value, which clears 4.93:1. A <button> also defaults to type="button" now, so
   one dropped into a form cannot submit it by accident. */

const BTN_SIZES = {
  sm: { padding: '9px 18px', fontSize: '11.5px' },
  md: { padding: '13px 28px', fontSize: '13px' },
  lg: { padding: '15px 34px', fontSize: '14px' }
};
const BTN_VARIANTS = {
  gold: { background: 'var(--mbs-gold-surface)', color: 'var(--mbs-navy)', borderColor: 'transparent' },
  navy: { background: 'var(--mbs-navy)', color: 'var(--mbs-white)', borderColor: 'transparent' },
  outline: { background: 'transparent', color: 'var(--mbs-navy)', borderColor: 'var(--mbs-border)' },
  ghost: { background: 'transparent', color: 'var(--mbs-gray)', borderColor: 'transparent' },
  onNavy: { background: 'var(--mbs-on-navy-fill-hi)', color: 'var(--mbs-on-navy-70)', borderColor: 'var(--mbs-on-navy-border)' }
};
const BTN_HOVER = {
  gold: { background: 'var(--mbs-gold)' },
  navy: { background: 'var(--mbs-navy-mid)' },
  outline: { borderColor: 'var(--mbs-gold)', color: 'var(--mbs-gold-text)' },
  ghost: { color: 'var(--mbs-navy)' },
  onNavy: { borderColor: 'var(--mbs-gold-border)', color: 'var(--mbs-white)' }
};

function Button({ children, variant = 'gold', size = 'md', href, block, disabled, onClick, type, style, ...rest }) {
  const [hover, setHover] = React.useState(false);
  const base = {
    display: block ? 'flex' : 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '8px',
    width: block ? '100%' : undefined, fontFamily: 'var(--mbs-font-sans)',
    fontWeight: 'var(--mbs-fw-semibold)', letterSpacing: 'var(--mbs-tr-btn)', lineHeight: 1,
    whiteSpace: 'nowrap', borderRadius: 'var(--mbs-r-sm)', border: '1.5px solid transparent',
    textDecoration: 'none', cursor: disabled ? 'default' : 'pointer',
    transition: 'all var(--mbs-dur) var(--mbs-ease)', opacity: disabled ? 0.45 : 1,
    pointerEvents: disabled ? 'none' : undefined,
    transform: hover && !disabled ? 'translateY(var(--mbs-lift))' : 'none',
    ...BTN_SIZES[size], ...BTN_VARIANTS[variant],
    ...(hover && !disabled ? BTN_HOVER[variant] : null), ...style
  };
  const Tag = href ? 'a' : 'button';
  return (
    <Tag href={href} onClick={onClick} style={base}
      type={href ? undefined : (type || 'button')}
      disabled={href ? undefined : disabled}
      aria-disabled={href && disabled ? 'true' : undefined}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} {...rest}>
      {children}
    </Tag>
  );
}

/* ── Card ───────────────────────────────────────────────────────────────────
   Upstream mixed the `border` shorthand (always set) with a `borderColor`
   longhand added only on hover. React clears a style property that's absent
   from the next render's style object — but clearing just borderColor after
   border had set all four sides leaves the shorthand's expansion corrupted in
   the DOM, so on mouseleave the card falls back to the browser default border
   color (currentColor — the inherited navy text), which reads as a permanent
   dark outline stuck on the card long after the pointer has left. Fix: never
   mix border with borderColor — every render sets the same three longhands
   (borderWidth/Style/Color), so no key is ever added or removed between the
   hovered and unhovered style objects. */
function Card({ children, tone = 'light', hover = true, accent, padding = '28px', style, onClick, ...rest }) {
  const [over, setOver] = React.useState(false);
  const dark = tone === 'navy';
  const lit = hover && over;
  const base = {
    position: 'relative',
    overflow: accent ? 'hidden' : undefined,
    background: dark ? (lit ? 'var(--mbs-navy-mid)' : 'var(--mbs-navy)') : 'var(--mbs-surface-card)',
    borderWidth: '1px', borderStyle: 'solid',
    borderColor: dark ? 'transparent' : (lit ? 'var(--mbs-gold-border)' : 'var(--mbs-border)'),
    borderRadius: 'var(--mbs-r)',
    padding,
    boxShadow: dark ? 'var(--mbs-sh-sm)' : (lit ? 'var(--mbs-sh-md)' : 'var(--mbs-sh-xs)'),
    color: dark ? 'var(--mbs-on-navy-50)' : undefined,
    transition: 'all var(--mbs-dur-slow) var(--mbs-ease)',
    cursor: onClick ? 'pointer' : undefined,
    transform: (!dark && !accent && lit) ? 'translateY(var(--mbs-lift-card))' : 'none',
    ...style
  };
  return (
    <div style={base} onClick={onClick}
      onMouseEnter={() => setOver(true)} onMouseLeave={() => setOver(false)} {...rest}>
      {accent && <span style={{
        position: 'absolute', top: 0, left: 0, width: '3px',
        height: over ? '100%' : 0, background: 'var(--mbs-gold)',
        borderRadius: '0 0 2px 2px', transition: 'height var(--mbs-dur-slow) var(--mbs-ease)'
      }} />}
      {children}
    </div>
  );
}

/* ── Badge ──────────────────────────────────────────────────────────────────
   Navy on brand gold was 4.00:1 and gold on navy 4.00:1; both move to the
   surface gold. Status chips keep their hues via the lifted --mbs-ok / --mbs-warn. */

const BADGE_VARIANTS = {
  tag: { background: 'var(--mbs-navy)', color: 'var(--mbs-gold-on-navy)' },
  gold: { background: 'var(--mbs-gold-surface)', color: 'var(--mbs-navy)' },
  goldSoft: { background: 'var(--mbs-gold-soft)', color: 'var(--mbs-gold-text)', border: '1px solid var(--mbs-gold-border)' },
  navy: { background: 'var(--mbs-navy)', color: 'var(--mbs-white)' },
  neutral: { background: 'var(--mbs-off)', color: 'var(--mbs-gray)' },
  outline: { background: 'transparent', color: 'var(--mbs-gray)', border: '1px solid var(--mbs-border)' },
  ok: { background: 'var(--mbs-ok-bg)', color: 'var(--mbs-ok)' },
  warn: { background: 'var(--mbs-warn-bg)', color: 'var(--mbs-warn)' },
  info: { background: 'var(--mbs-info-bg)', color: 'var(--mbs-info)' },
  danger: { background: 'var(--mbs-danger-bg)', color: 'var(--mbs-danger)' }
};

function Badge({ children, variant = 'gold', dot, style }) {
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: '6px', fontFamily: 'var(--mbs-font-sans)',
      fontWeight: 'var(--mbs-fw-semibold)', fontSize: 'var(--mbs-fs-badge)',
      letterSpacing: 'var(--mbs-tr-btn)', textTransform: 'uppercase', lineHeight: 1,
      padding: '4px 11px', borderRadius: 'var(--mbs-r-pill)', ...BADGE_VARIANTS[variant], ...style
    }}>
      {dot && <span style={{ width: '.5em', height: '.5em', borderRadius: '50%', background: 'currentColor' }} />}
      {children}
    </span>
  );
}

/* ── PrincipleCard / StepCard / FaqItem / Timeline ──────────────────────────
   Four cards that each titled themselves with an h4 directly under a section's
   h2, skipping a level. They are h3 now. StepCard's body text was white at 45%
   on navy (3.5:1) and Timeline's dates were brand gold (2.65:1). */

function PrincipleCard({ icon, title, children, style }) {
  const [over, setOver] = React.useState(false);
  return (
    <div data-on-navy="" onMouseEnter={() => setOver(true)} onMouseLeave={() => setOver(false)} style={{
      display: 'flex', gap: '14px', alignItems: 'flex-start', padding: '18px',
      borderRadius: 'var(--mbs-r)', background: over ? 'var(--mbs-navy-mid)' : 'var(--mbs-navy)',
      boxShadow: 'var(--mbs-sh-sm)', transition: 'background var(--mbs-dur) var(--mbs-ease)', ...style
    }}>
      <div style={{
        width: '32px', height: '32px', borderRadius: 'var(--mbs-r-sm)', background: 'var(--mbs-gold-tile)',
        border: '1px solid var(--mbs-gold-tile-border)', display: 'flex', alignItems: 'center',
        justifyContent: 'center', flexShrink: 0, fontSize: '14px', color: 'var(--mbs-gold-on-navy)'
      }}>{icon}</div>
      <div>
        <h3 style={{
          fontFamily: 'var(--mbs-font-sans)', fontSize: 'var(--mbs-fs-ui)',
          fontWeight: 'var(--mbs-fw-semibold)', color: 'var(--mbs-white)', margin: '0 0 3px'
        }}>{title}</h3>
        <p style={{ fontSize: 'var(--mbs-fs-meta)', color: 'var(--mbs-on-navy-50)', lineHeight: 'var(--mbs-lh-tight)', margin: 0 }}>{children}</p>
      </div>
    </div>
  );
}

function StepCard({ number, title, children, style }) {
  return (
    <div data-on-navy="" style={{
      textAlign: 'center', padding: '32px 16px', background: 'var(--mbs-navy)',
      border: '1px solid var(--mbs-navy)', borderRadius: 'var(--mbs-r)',
      boxShadow: 'var(--mbs-sh-sm)', ...style
    }}>
      <div className="mbs-tabular" style={{
        width: '48px', height: '48px', borderRadius: 'var(--mbs-r-sm)',
        background: 'var(--mbs-gold-surface)', display: 'flex', alignItems: 'center',
        justifyContent: 'center', margin: '0 auto 14px', fontFamily: 'var(--mbs-font-serif)',
        fontSize: '18px', fontWeight: 'var(--mbs-fw-bold)', color: 'var(--mbs-navy)'
      }}>{number}</div>
      <h3 style={{
        fontFamily: 'var(--mbs-font-sans)', fontSize: 'var(--mbs-fs-ui)',
        fontWeight: 'var(--mbs-fw-semibold)', color: 'var(--mbs-white)', margin: '0 0 6px'
      }}>{title}</h3>
      <p style={{ fontSize: 'var(--mbs-fs-meta)', color: 'var(--mbs-on-navy-50)', lineHeight: 1.6, margin: 0 }}>{children}</p>
    </div>
  );
}

/* FaqItem's toggle was a <div onClick> with a ▾ character: not focusable, not
   operable by keyboard, and announced as nothing. It is a <button> with the
   kit's own chevron now; the panel is properly associated with it. */

function FaqItem({ question, children, defaultOpen = false, style }) {
  const [open, setOpen] = React.useState(defaultOpen);
  const id = useUid();
  return (
    <div style={{
      background: 'var(--mbs-white)', border: '1px solid var(--mbs-border)',
      borderRadius: 'var(--mbs-r)', overflow: 'hidden', boxShadow: 'var(--mbs-sh-xs)', ...style
    }}>
      <h3 style={{ margin: 0 }}>
        <button type="button" onClick={() => setOpen(o => !o)} aria-expanded={open} aria-controls={id}
          style={{
            width: '100%', padding: '20px 24px', cursor: 'pointer', display: 'flex',
            justifyContent: 'space-between', alignItems: 'center', gap: '16px',
            background: 'transparent', border: 0, textAlign: 'left',
            fontFamily: 'var(--mbs-font-sans)', fontSize: 'var(--mbs-fs-h4)',
            fontWeight: 'var(--mbs-fw-semibold)', color: 'var(--mbs-navy)'
          }}>
          {question}
          <Icon name="chevronDown" size="18px" style={{
            color: 'var(--mbs-gold-text)', flexShrink: 0,
            transform: open ? 'rotate(180deg)' : 'none',
            transition: 'transform var(--mbs-dur) var(--mbs-ease)'
          }} />
        </button>
      </h3>
      {open && (
        <div id={id} style={{ padding: '0 24px 20px' }}>
          <p style={{ fontSize: 'var(--mbs-fs-body-sm)', color: 'var(--mbs-gray)', lineHeight: 'var(--mbs-lh-prose)', margin: 0 }}>{children}</p>
        </div>
      )}
    </div>
  );
}

/* Timeline becomes an <ol> — it is an ordered sequence of dates — and the past
   markers' gold date text moves to the AA-safe gold. Visually identical. */

function Timeline({ items = [], style }) {
  return (
    <ol style={{ position: 'relative', paddingLeft: '32px', listStyle: 'none', margin: 0, ...style }}>
      <span aria-hidden="true" style={{
        position: 'absolute', left: '6px', top: '6px', bottom: '6px', width: '2px', background: 'var(--mbs-border)'
      }} />
      {items.map((it, i) => (
        <li key={i} style={{ position: 'relative', marginBottom: i === items.length - 1 ? 0 : '24px' }}>
          <span aria-hidden="true" style={{
            position: 'absolute', left: '-32px', top: '5px', width: '12px', height: '12px',
            borderRadius: '50%', background: it.upcoming ? 'var(--mbs-white)' : 'var(--mbs-gold)',
            border: it.upcoming ? '2px solid var(--mbs-border)' : 'none',
            boxShadow: '0 0 0 3px var(--mbs-white)'
          }} />
          <div style={{
            fontSize: 'var(--mbs-fs-label)', fontWeight: 'var(--mbs-fw-bold)',
            letterSpacing: 'var(--mbs-tr-badge)', textTransform: 'uppercase',
            color: it.upcoming ? 'var(--mbs-gray-light)' : 'var(--mbs-gold-text)',
            marginBottom: '4px'
          }}>{it.date}</div>
          <h3 style={{
            fontFamily: 'var(--mbs-font-sans)', fontSize: 'var(--mbs-fs-h4)',
            fontWeight: 'var(--mbs-fw-semibold)', color: 'var(--mbs-navy)', margin: '0 0 4px'
          }}>{it.title}</h3>
          {it.description && <p style={{ fontSize: 'var(--mbs-fs-ui)', color: 'var(--mbs-gray)', lineHeight: 1.6, margin: 0 }}>{it.description}</p>}
        </li>
      ))}
    </ol>
  );
}

/* ── EventListItem ──────────────────────────────────────────────────────────
   The row was a <div onClick>: the entire events list could not be reached or
   opened from a keyboard. The title is a real button now, stretched over the
   row by a pseudo-element, so the whole card stays clickable while the heading
   stays a heading and the control gets a proper name. The gold date chip moves
   to the surface gold (navy on brand gold was 4.00:1 for the month). */

function EventListItem({ day, month, title, tag, children, location, time, onClick, style }) {
  const [over, setOver] = React.useState(false);
  return (
    <div className={'mbs-eventrow' + (onClick ? ' mbs-rowcard' : '')}
      onMouseEnter={() => setOver(true)} onMouseLeave={() => setOver(false)}
      style={{
        background: 'var(--mbs-white)',
        border: '1px solid ' + (over ? 'var(--mbs-gold-tile-border)' : 'var(--mbs-border)'),
        borderRadius: 'var(--mbs-r)', overflow: 'hidden', boxShadow: 'var(--mbs-sh-xs)',
        transition: 'all var(--mbs-dur-slow) var(--mbs-ease)', ...style
      }}>
      <div className="mbs-eventrow-date">
        <span className="mbs-tabular mbs-eventrow-day">{day}</span>
        <span className="mbs-eventrow-month">{month}</span>
      </div>
      <div className="mbs-eventrow-body">
        <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '6px', flexWrap: 'wrap' }}>
          <h3 style={{
            fontFamily: 'var(--mbs-font-serif)', fontSize: 'var(--mbs-fs-card-title)',
            fontWeight: 'var(--mbs-fw-semibold)', color: 'var(--mbs-navy)', margin: 0
          }}>
            {onClick
              ? <button type="button" className="mbs-rowcard-target" onClick={onClick}>{title}</button>
              : title}
          </h3>
          {tag && <Badge variant="gold">{tag}</Badge>}
        </div>
        <p style={{ fontSize: 'var(--mbs-fs-ui)', color: 'var(--mbs-gray)', lineHeight: 1.6, margin: '0 0 8px' }}>{children}</p>
        <div style={{ display: 'flex', gap: '16px', flexWrap: 'wrap', fontSize: '11px', color: 'var(--mbs-gray-light)' }}>
          {location && <span style={{ display: 'inline-flex', alignItems: 'center', gap: '5px' }}><Icon name="pin" size="12px" />{location}</span>}
          {time && <span style={{ display: 'inline-flex', alignItems: 'center', gap: '5px' }}><Icon name="clock" size="12px" />{time}</span>}
        </div>
      </div>
    </div>
  );
}

/* ── EventCard ──────────────────────────────────────────────────────────────
   Only patched because it reaches for the bundle's own private Badge, which the
   namespace patch cannot reach — its tags kept rendering at 4.00:1. Composition
   is otherwise byte-for-byte the original. */

function EventCard({ icon, title, children, tags = [], onClick, style }) {
  return (
    <DS.Card accent onClick={onClick} style={style}>
      {icon && <div style={{ fontSize: '24px', marginBottom: '14px', lineHeight: 1 }}>{icon}</div>}
      <h3 style={{
        fontFamily: 'var(--mbs-font-serif)', fontSize: 'var(--mbs-fs-card-title)',
        fontWeight: 'var(--mbs-fw-semibold)', color: 'var(--mbs-navy)', margin: '0 0 8px'
      }}>{title}</h3>
      <p style={{ fontSize: 'var(--mbs-fs-card)', color: 'var(--mbs-gray)', lineHeight: 'var(--mbs-lh-body)', margin: 0 }}>{children}</p>
      {tags.length > 0 && (
        <div style={{ display: 'flex', gap: '6px', marginTop: '14px', flexWrap: 'wrap' }}>
          {tags.map(t => <Badge key={t} variant="tag">{t}</Badge>)}
        </div>
      )}
    </DS.Card>
  );
}

/* ── Checkbox ───────────────────────────────────────────────────────────────
   16px is below the 24px minimum target; the box grows and the label picks up
   enough padding that the whole row is comfortably tappable. */

function Checkbox({ label, style, ...rest }) {
  return (
    <label style={{
      display: 'inline-flex', alignItems: 'center', gap: '10px', minHeight: '24px',
      padding: '2px 0', fontSize: 'var(--mbs-fs-ui)', color: 'var(--mbs-gray)',
      cursor: 'pointer', ...style
    }}>
      <input type="checkbox" style={{ accentColor: 'var(--mbs-gold-text)', width: '18px', height: '18px', margin: 0, flexShrink: 0 }} {...rest} />
      {label}
    </label>
  );
}

/* ── StatTile ───────────────────────────────────────────────────────────────
   The gold figure was brand gold on white: 2.65:1 against a 3:1 requirement
   even at 40px. */

function StatTile({ value, label, tone = 'navy', style }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '4px', ...style }}>
      <span className="mbs-tabular" style={{
        fontFamily: 'var(--mbs-font-serif)', fontWeight: 'var(--mbs-fw-bold)', fontSize: '40px',
        lineHeight: 1, color: tone === 'gold' ? 'var(--mbs-gold-text)' : 'var(--mbs-navy)'
      }}>{value}</span>
      <span style={{
        fontSize: 'var(--mbs-fs-label)', textTransform: 'uppercase', letterSpacing: '1.5px',
        fontWeight: 'var(--mbs-fw-bold)', color: 'var(--mbs-gray)'
      }}>{label}</span>
    </div>
  );
}

/* ── MemberCard ─────────────────────────────────────────────────────────────
   Role badge moves to the AA-safe gold; the placeholder initials and "Foto"
   label were 1.6–1.8:1 and are lifted enough to read while staying obviously
   unfilled. The name is an h3 so the section's h2 is not skipped. */

function MemberCard({ name, role, initials, description, photoSrc, photoStyle, style }) {
  const [over, setOver] = React.useState(false);
  /* The hover lift used to live on the same element as the rounded
     overflow:hidden clip. Safari won't reliably round-clip an element that
     also carries a transform, which let a hairline sliver of whatever sits
     behind the photo show past the curve on one side. Moving the transform
     to this outer, unclipped wrapper and keeping the clip on an inner
     element that never transforms avoids the bug outright. */
  return (
    <div onMouseEnter={() => setOver(true)} onMouseLeave={() => setOver(false)} style={{
      transform: over ? 'translateY(var(--mbs-lift-card))' : 'none',
      transition: 'transform var(--mbs-dur-slow) var(--mbs-ease)', ...style
    }}>
      <div style={{
        textAlign: 'center', borderRadius: 'var(--mbs-r)', background: 'var(--mbs-white)', overflow: 'hidden',
        border: '1px solid ' + (over ? 'var(--mbs-gold-border)' : 'var(--mbs-border)'),
        boxShadow: over ? 'var(--mbs-sh-lg)' : 'var(--mbs-sh-xs)',
        transition: 'all var(--mbs-dur-slow) var(--mbs-ease)'
      }}>
        <div style={{
          width: '100%', aspectRatio: photoSrc ? '4 / 5' : '1 / 1', background: photoSrc ? 'var(--mbs-white)' : 'var(--mbs-navy)', display: 'flex',
          flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '8px',
          borderBottom: '3px solid var(--mbs-gold)', overflow: 'hidden', position: 'relative'
        }}>
          {photoSrc ? (
            <img src={photoSrc} alt={name} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', ...photoStyle }} />
          ) : (
            <React.Fragment>
              <span aria-hidden="true" style={{
                fontFamily: 'var(--mbs-font-serif)', fontSize: '40px', fontWeight: 'var(--mbs-fw-bold)',
                color: 'var(--mbs-gold-on-navy)', letterSpacing: '2px', opacity: .5
              }}>{initials}</span>
              <span style={{
                fontSize: '10px', fontWeight: 'var(--mbs-fw-semibold)', color: 'var(--mbs-on-navy-35)',
                letterSpacing: '2px', textTransform: 'uppercase'
              }}>Foto</span>
            </React.Fragment>
          )}
        </div>
        <div style={{ padding: '24px 20px 28px' }}>
          <h3 style={{
            fontFamily: 'var(--mbs-font-sans)', fontSize: 'var(--mbs-fs-h4)',
            fontWeight: 'var(--mbs-fw-semibold)', color: 'var(--mbs-navy)', margin: '0 0 4px'

const ACTIVE = 'membership';

function Page() {

  React.useEffect(() => {
    if (!ev) return;
    const onKey = e => { if (e.key === 'Escape') closeEvent(); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
